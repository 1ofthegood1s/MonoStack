<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LILY Monolith</title>
    <style>
      /* Palette variables are injected from src/config.ts at boot. */
      * { margin: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #000; }
      body {
        font-family: Menlo, 'SF Mono', ui-monospace, monospace;
        color: var(--white);
        user-select: none;
        -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      .hud {
        position: fixed; pointer-events: none; z-index: 1;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.95), 0 2px 12px rgba(0, 0, 0, 0.9);
      }
      #count {
        top: 24px; left: 50%; transform: translateX(-50%);
        font-size: 44px; font-weight: 700; letter-spacing: 0.04em;
        color: var(--lime);
      }
      #best {
        top: 30px; right: 28px;
        font-size: 14px; letter-spacing: 0.12em;
        color: var(--white55);
      }
      #pips {
        top: 86px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px;
      }
      #pips span { width: 10px; height: 10px; background: var(--lime); }
      #points {
        top: 104px; left: 50%; transform: translateX(-50%);
        font-size: 13px; letter-spacing: 0.12em; color: var(--white55);
      }
      #mute {
        position: fixed; top: 28px; left: 28px; z-index: 1;
        pointer-events: auto; cursor: pointer;
        font: inherit; font-size: 11px; letter-spacing: 0.14em;
        padding: 6px 10px;
        background: none; border: 1px solid var(--hairline); color: var(--white55);
      }
      .overlay {
        position: fixed; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; text-align: center;
        background: rgba(0, 0, 0, 0.72);
      }
      .overlay.hidden { display: none; }
      .gone { display: none !important; }
      /* See-through scrims (win: the lit monolith, start: the sliding block)
         that still darken hardest behind the text column for contrast. */
      #overlay-won, #overlay-start {
        background: radial-gradient(
          ellipse 72% 58% at center,
          rgba(0, 0, 0, 0.78) 0%,
          rgba(0, 0, 0, 0.30) 100%
        );
      }
      .overlay h1, .overlay p {
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.95), 0 2px 16px rgba(0, 0, 0, 0.9);
      }
      .overlay .hint { font-size: 12px; color: var(--white55); }
      .overlay h1 { font-size: 72px; font-weight: 700; letter-spacing: 0.18em; }
      .overlay .accent { color: var(--lime); }
      .overlay p { font-size: 15px; letter-spacing: 0.08em; color: var(--white); }
      .overlay button {
        pointer-events: auto; cursor: pointer;
        font: inherit; font-size: 15px; letter-spacing: 0.14em;
        padding: 12px 32px;
        background: rgba(0, 0, 0, 0.6); border: 1px solid var(--lime); color: var(--lime);
      }
      .overlay button:hover { background: var(--lime); color: var(--limeInk); }
      #reward-slot {
        min-height: 96px; min-width: 320px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        border: 1px dashed var(--hairline);
        font-size: 12px; letter-spacing: 0.14em; color: var(--white55);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud" id="count"></div>
    <div class="hud" id="best"></div>
    <div class="hud" id="pips"></div>
    <div class="hud" id="points"></div>
    <button id="mute"></button>

    <div class="overlay" id="overlay-start">
      <h1><span class="accent">LILY</span> MONOLITH</h1>
      <p>STACK 30 BLOCKS. MISSES GET TRIMMED.</p>
      <p>TAP, CLICK, OR PRESS SPACE. M FOR SOUND.</p>
    </div>

    <div class="overlay hidden" id="overlay-lost">
      <h1>THE RUN ENDS</h1>
      <p id="lost-stats"></p>
      <button data-restart>RESTART</button>
      <button data-share>SHARE</button>
      <p class="hint">SPACE OR TAP TO RETRY</p>
    </div>

    <div class="overlay hidden" id="overlay-won">
      <h1 class="accent">LILY</h1>
      <p id="won-stats"></p>
      <!-- REWARD_PLACEHOLDER: wire the reward content into #reward-slot below.
           Shown only when the completed run had >= REWARD.MIN_PERFECTS perfects;
           otherwise #consolation rotates through REWARD.CONSOLATION. -->
      <div id="reward-slot">REWARD PLACEHOLDER</div>
      <p id="consolation" class="gone"></p>
      <button data-restart>PLAY AGAIN</button>
      <button data-share>SHARE</button>
      <p class="hint">SPACE OR TAP TO PLAY AGAIN</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
