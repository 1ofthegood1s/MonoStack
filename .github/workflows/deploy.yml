name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Force the Pages source to workflow-deploys so the legacy branch build
      # stops racing (and overwriting) this deployment.
      - name: Set Pages source to GitHub Actions
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' -o /tmp/flip.json -w 'flip status: %{http_code}\n'
          cat /tmp/flip.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # While the Pages source is still "Deploy from a branch", GitHub also runs
      # a legacy Jekyll build for every push and whichever deployment finishes
      # last wins. Wait for the legacy run to complete so ours always lands last.
      - name: Wait out the legacy branch build
        run: |
          for i in $(seq 1 30); do
            S=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              | jq -r 'first(.workflow_runs[] | select(.name == "pages build and deployment")).status // empty')
            echo "poll $i: legacy build = ${S:-absent}"
            if [ "$S" = "completed" ]; then break; fi
            if [ -z "$S" ] && [ "$i" -ge 6 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
